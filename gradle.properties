# Arboretum build properties.
#
# Version architecture
# --------------------
# Arboretum ships ONE universal jar covering every supported Minecraft release, assembled the way
# GriefPrevention3D does it: a Java-21 bootstrap surface plus one adapter package per namespace
# era. See docs/compatibility.md for the evidence behind each number here.
version = 0.1.0
group = codes.castled.arboretum

maven_group = codes.castled.arboretum
mod_version = 0.1.0
archives_base_name = Arboretum

# --- Toolchains ---------------------------------------------------------------------------------
# Java 21 is the floor for every Minecraft release Arboretum supports, so the bootstrap and the
# core compile to Java 21 bytecode. The Minecraft-facing adapters compile higher (see below) but
# are only ever loaded by a runtime new enough for them.
core_java_version = 21

# --- Minecraft targets -------------------------------------------------------------------------
# 26.x runs unobfuscated in the Mojang namespace with no remap step and needs Java 25.
# 1.21.11 is remapped to intermediary and needs Java 21.
minecraft_1_21_11 = 1.21.11
minecraft_26_1 = 26.1.2
minecraft_26_3 = 26.3

fabric_loader_version = 0.19.5
fabric_api_1_21_11 = 0.141.6+1.21.11
fabric_api_26_1 = 0.155.3+26.1.2
fabric_api_26_3 = 0.162.0+26.3

# Release ranges advertised by the universal jar's fabric.mod.json. A list means any one matching
# range is acceptable; GriefPrevention3D uses the same shape.
fabric_minecraft_range_1_21_11 = ">=1.21.11 <1.21.12-"
fabric_minecraft_range_26_x = ">=26.1 <26.4-"

# --- Paper targets ------------------------------------------------------------------------------
paper_api_compile = 26.3.build.141-beta
paper_api_floor = 1.21.11-R0.1-SNAPSHOT

loom_version = 1.15-SNAPSHOT

org.gradle.jvmargs = -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true